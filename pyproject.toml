[project]
name = "ai-course-track"
version = "0.1.0"
description = "ROLE — FiftyFive AI engineering course (Track 4). Infra spine ported from VOX."
# 3.12, not 3.14: torch has no 3.14 wheels, and both silero-vad and kokoro need it.
requires-python = ">=3.10,<3.13"
# Ported verbatim from ai-course-vox: this is the dependency set the copied src/ modules import.
# Prune once ROLE decides which stages it keeps (see docs/vox-reuse-port-plan.md).
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",   # mic capture + speaker playback (PortAudio)
    "soundfile>=0.12",      # WAV encode for the Groq upload
    "torch>=2.2",           # silero-vad and kokoro both run on it
    "torchaudio>=2.2",      # resampling a recording to the 16 kHz silero and whisper expect
    "silero-vad>=5.1",      # snakers4/silero-vad — endpointing
    "kokoro>=0.9",          # hexgrad/Kokoro-82M — local TTS
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "httpx>=0.27",          # Groq + NVIDIA NIM HTTP calls
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",  # Systran/faster-whisper-base — the CTranslate2 runtime
    "sentencepiece>=0.2",   # SpeechT5Tokenizer refuses to load without it
    "piper-tts>=1.7",       # rhasspy/piper-voices — the fast TTS arm
    "huggingface-hub>=0.23",
    "pypdf>=6.16.1",
    "transformers>=4.44",   # local whisper arm, speecht5, and the sentence encoder
    "rank-bm25>=0.2.2",     # Okapi BM25 for the lexical half of retrieval
    "pillow>=12.3.0",
    "torchvision>=0.28.0",
    "verovio>=6.3.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# en-core-web-sm is only distributed as a release URL, not on PyPI.
[tool.hatch.metadata]
allow-direct-references = true
